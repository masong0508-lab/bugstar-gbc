name: Build GBC ROM
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 3D cockpit, space docking and perspective continuity
        run: python3 tools/check_space3d.py
      - name: Validate expanded bestiary sprites, AI and save compatibility
        run: python3 tools/check_monsters.py
      - name: Test real GBC quest code for 256-world softlocks and story spoilers
        run: python3 tools/check_quests.py
      - name: Host tests (save system + menus)
        run: make test
      - name: Install GBDK-2020
        run: |
          curl -sL https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz | tar xz -C /opt
      - name: Build
        run: make -j2 GBDK_HOME=/opt/gbdk
      - name: Validate final ROM image and GBC cartridge checksums
        run: python3 tools/check_rom_header.py bugstar.gbc
      - name: Headless GBC emulator boot and title-button smoke test
        continue-on-error: true
        run: |
          python3 -m venv /tmp/bugstar-pyboy
          for attempt in 1 2 3; do
            if /tmp/bugstar-pyboy/bin/pip install --quiet --retries 6 --timeout 45 "pyboy>=2.0,<3.0" pillow; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Package server interrupted the emulator setup, retrying..."
            sleep 4
          done
          /tmp/bugstar-pyboy/bin/python tools/smoke_gbc.py bugstar.gbc smoke/boot.png
      - uses: actions/upload-artifact@v4
        with:
          name: gbc-real-emulator-capture
          path: smoke/boot.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with: { name: bugstar-gbc, path: bugstar.gbc }
