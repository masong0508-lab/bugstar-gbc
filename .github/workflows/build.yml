name: Build GBC ROM
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (save system + menus)
        run: make test
      - name: Install GBDK-2020
        run: |
          curl -sL https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz | tar xz -C /opt
      - name: Build
        run: make GBDK_HOME=/opt/gbdk
      - uses: actions/upload-artifact@v4
        with: { name: bugstar-gbc, path: bugstar.gbc }
