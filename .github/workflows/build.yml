name: Build GBC ROM
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 3D cockpit, space docking and perspective continuity
        run: python3 tools/check_space3d.py
      - name: Validate expanded bestiary sprites, AI and save compatibility
        run: python3 tools/check_monsters.py
      - name: Host tests (save system + menus)
        run: make test
      - name: Install GBDK-2020
        run: |
          curl -sL https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz | tar xz -C /opt
      - name: Build
        run: make -j2 GBDK_HOME=/opt/gbdk
      - name: Validate final ROM image and GBC cartridge checksums
        run: python3 tools/check_rom_header.py bugstar.gbc
      - uses: actions/upload-artifact@v4
        with: { name: bugstar-gbc, path: bugstar.gbc }
