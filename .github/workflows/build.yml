name: Build GBC ROM
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit kart WRAM scratch and fixed interrupt buffer separation
        run: python3 tools/check_kart_wram.py
      - name: Test kart shield lifetime, collision protection and item timers
        run: python3 tools/check_kart_items.py
      - name: Test kart directional control, turbo caps and off-road recovery
        run: python3 tools/check_kart_control.py
      - name: Verify weather RNG, town text bounds, and errands under UBSan
        run: python3 tools/check_weather_towns.py
      - name: Check 3D cockpit, space docking and perspective continuity
        run: python3 tools/check_space3d.py
      - name: Test 2D/3D pirate salvage, full supplies and pickup memory safety
        run: python3 tools/check_salvage.py
      - name: Test all 256 space destinations, landing, docking and pirate delays
        run: python3 tools/check_space_runtime.py
      - name: Validate expanded bestiary sprites, AI and save compatibility
        run: python3 tools/check_monsters.py
      - name: Test real GBC quest code for 256-world softlocks and story spoilers
        run: python3 tools/check_quests.py
      - name: Validate GBC memory continuity and paced 20-column ending
        run: python3 tools/check_story.py
      - name: Check Bolt's current-world directions across 256 procedural stars
        run: python3 tools/check_bolt_guidance.py
      - name: Test bounty jobs for kill, ore and pirate counter wrap
        run: python3 tools/check_bounties.py
      - name: Host tests (save system + menus)
        run: make test
      - name: Install GBDK-2020
        run: |
          curl -sL https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz | tar xz -C /opt
      - name: Build
        run: make -j2 GBDK_HOME=/opt/gbdk
      - name: Validate final ROM image and GBC cartridge checksums
        run: python3 tools/check_rom_header.py bugstar.gbc
      - name: Headless GBC emulator boot and title-button smoke test
        continue-on-error: true
        run: |
          python3 -m venv /tmp/bugstar-pyboy
          for attempt in 1 2 3; do
            if /tmp/bugstar-pyboy/bin/pip install --quiet --retries 6 --timeout 45 "pyboy>=2.0,<3.0" pillow; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Package server interrupted the emulator setup, retrying..."
            sleep 4
          done
          /tmp/bugstar-pyboy/bin/python tools/smoke_gbc.py bugstar.gbc smoke/boot.png
      - uses: actions/upload-artifact@v4
        with:
          name: gbc-real-emulator-capture
          path: smoke/boot.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with: { name: bugstar-gbc, path: bugstar.gbc }
